# Velvet Crown Hotel Management System - Spring Boot Configuration
server.port=8080
server.servlet.context-path=/

# Active profile: default is 'mysql', can be switched to 'dev' (H2 in MySQL mode)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:mysql}

# Application metadata
spring.application.name=velvet-crown-hotel-backend

# JWT / Security Secret
app.jwt.secret=${JWT_SECRET:replace-with-a-long-random-secret-before-deployment}
app.jwt.expiration-ms=86400000

# JSON Formatting
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
